# drft.toml — drft dogfooding itself

include = ["*.md", "src/**/*.rs", ".claude/settings.json"]
exclude = ["src/lib.rs", "CHANGELOG.md", "npm/*"]

[parsers.markdown]
files = ["*.md"]

[parsers.frontmatter]
files = ["*.md"]

[rules]
stale = "error"
fragility = "off"
layer-violation = "off"
redundant-edge = "off"

[rules.schema-violation]
files = ["docs/**"]
ignore = ["docs/README.md"]

[rules.schema-violation.options.schemas."docs/**"]
required = ["sources"]
