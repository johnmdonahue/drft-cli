# drft.toml — drft dogfooding itself

include = ["*.md", "*.rs", ".claude/settings.json"]

[parsers.markdown]
files = ["*.md"]

[rules]
stale = "error"

# Hub files (READMEs, root docs) are structural connectors — they link
# broadly by design, so fragility, layer-violation, and redundant-edge
# produce expected warnings on them.
[rules.fragility]
ignore = ["**/README.md", "CONTRIBUTING.md", "CHANGELOG.md", "CLAUDE.md", "RELEASING.md", "docs/config.md"]

[rules.fragmentation]
ignore = ["CHANGELOG.md", "npm/README.md"]

[rules.layer-violation]
ignore = ["**/README.md", "CONTRIBUTING.md", "CHANGELOG.md", "CLAUDE.md", "RELEASING.md", "docs/config.md"]

[rules.orphan-node]
ignore = ["CHANGELOG.md", "npm/README.md"]

[rules.redundant-edge]
ignore = ["**/README.md", "CONTRIBUTING.md", "docs/config.md"]
