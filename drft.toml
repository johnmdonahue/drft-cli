# drft.toml — drft dogfooding itself

include = ["*.md", "*.rs"]

[parsers]
markdown = true

[rules]
# All rules default to warn. Override only what you need.
stale = "error"       # recommended for LLM workflows and CI
fragility = "off"     # tree-shaped docs are expected to have bridges
layer-violation = "off"  # ARCHITECTURE.md intentionally links deep
redundant-edge = "off"   # docs/rules/README.md cross-references are intentional
