# drft.toml — drft dogfooding itself

include = [
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "README.md",
  "RELEASING.md",
  "docs/**/*.md",
  "examples/README.md",
  "examples/*/README.md",
  "src/**/*.rs",
  ".claude/settings.json",
]
exclude = ["src/lib.rs"]

[parsers.markdown]
files = ["**/*.md"]

[parsers.frontmatter]
files = ["**/*.md"]

[rules]
stale = "error"

[rules.schema-violation]
files = ["docs/**"]
ignore = ["docs/README.md"]

[rules.schema-violation.options.schemas."docs/**"]
required = ["sources"]
