# drft.toml — drft dogfooding itself

# The graph root is this directory. fs walks every file under it, except
# .gitignore matches (target/, etc.) and these globs.
ignore = [
  "Cargo.lock",
]

[graphs.markdown]
source = "fs"
filter = ["**/*.md"]
builder = "markdown"

[graphs.frontmatter]
source = "fs"
filter = ["**/*.md"]
builder = "frontmatter"

# Drift is the value prop — promote staleness to error for CI.
[rules.stale-node]
severity = "error"

[rules.stale-edge]
severity = "error"

# A source repo has many legitimately unlinked files (Cargo.toml, most .rs).
[rules.detached-node]
severity = "off"
