# drft.toml — drft dogfooding itself

include = ["*.md", "*.rs", ".claude/settings.json"]

[parsers.markdown]
files = ["*.md"]

[rules]
# All rules default to warn. Override only what you need.
stale = "error" # recommended for LLM workflows and CI
# fragility = "off" # tree-shaped docs are expected to have bridges
# layer-violation = "off" # CONTRIBUTING.md intentionally links deep
# redundant-edge = "off" # docs/rules/README.md cross-references are intentional

[rules.fragility]
ignore = [
  "**/README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "RELEASING.md",
  "npm/README.md",
]

[rules.fragmentation]
ignore = ["CHANGELOG.md", "npm/README.md"]

[rules.layer-violation]
ignore = [
  "**/README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "RELEASING.md",
  "npm/README.md",
  "docs/config.md",
]

[rules.orphan-node]
ignore = [
  "**/README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "RELEASING.md",
  "npm/README.md",
]

[rules.redundant-edge]
ignore = ["**/README.md", "CONTRIBUTING.md", "docs/config.md"]
