[package]
name = "drft-cli"
version = "0.3.0"
edition = "2024"
description = "A structural integrity checker for linked file systems"
license = "MIT"
repository = "https://github.com/johnmdonahue/drft-cli"
homepage = "https://github.com/johnmdonahue/drft-cli"
readme = "README.md"
keywords = ["graph", "linter", "dependency-graph", "structural-integrity"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "drft"
path = "src/lib.rs"

[[bin]]
name = "drft"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = "0.12"
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-mini = "0.5"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
