[package]
name = "drft-cli"
version = "0.1.0"
edition = "2021"
description = "A structural integrity checker for markdown directories"
license = "MIT"
repository = "https://github.com/johnmdonahue/drft-cli"
homepage = "https://github.com/johnmdonahue/drft-cli"
readme = "README.md"
keywords = ["markdown", "linter", "dependency-graph", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "drft"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = "0.12"
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-mini = "0.5"

[dev-dependencies]
tempfile = "3"
