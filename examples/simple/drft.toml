# drft.toml

# Glob patterns for files to exclude from discovery
ignore = []

[parsers]
markdown = true

# Rules: "error", "warn", or "off"
[rules]
dangling-edge = "warn"
boundary-violation = "warn"
directed-cycle = "warn"
directory-edge = "warn"
encapsulation-violation = "warn"
symlink-edge = "off"
orphan-node = "off"
stale = "warn"
