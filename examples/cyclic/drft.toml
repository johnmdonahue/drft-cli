# drft.toml

# Glob patterns for files to exclude from discovery
ignore = []

[parsers]
markdown = true

# Rules: "error", "warn", or "off"
[rules]
broken-link = "warn"
containment = "warn"
cycle = "warn"
directory-link = "warn"
encapsulation = "warn"
indirect-link = "off"
orphan = "off"
stale = "warn"
